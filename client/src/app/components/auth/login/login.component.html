<div class="flex items-center justify-center min-h-screen bg-gray-100">
  <div class="w-full max-w-sm bg-white p-6 rounded-lg">
    <h2 class="text-2xl font-bold text-center mb-4">Panel Login</h2>
    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <mat-form-field class="w-full mb-4">
        <mat-label>Email</mat-label>
        <input matInput placeholder="Email" formControlName="email">
        <mat-error *ngIf="email?.hasError('required')">Email is required.</mat-error>
        <mat-error *ngIf="email?.hasError('email')">Invalid email format.</mat-error>
      </mat-form-field>

      <mat-form-field class="w-full mb-4">
        <mat-label>Password</mat-label>
        <input matInput type="password" placeholder="Password" formControlName="password">
        <mat-error *ngIf="password?.hasError('required')">Password is required.</mat-error>
        <mat-error *ngIf="password?.hasError('minlength')">Password must be at least 8 characters.</mat-error>
      </mat-form-field>

      <button type="submit" mat-flat-button color="primary" class="w-full" [disabled]="loginForm.invalid">Login</button>
    </form>
  </div>
</div>
