<div class="max-w-3xl mx-auto p-6 bg-white shadow-md rounded-lg">
  <h2 class="text-2xl font-bold text-gray-800 mb-4">📄 Kullanıcı Detayı</h2>

  <div *ngIf="(user$ | async) as user; else loading">
    <div class="flex items-center gap-3 mb-5">
      <div class="w-12 h-12 bg-gray-300 rounded-full flex items-center justify-center text-gray-700 font-semibold">
        {{ user.name[0] | uppercase }}
      </div>
      <div class="text-lg font-semibold text-gray-900">
        {{ user.name }}
      </div>
    </div>

    <div class="mb-4">
      <h3 class="text-xl font-semibold text-gray-800">📝 {{ user.email }}</h3>
    </div>

    <div class="bg-gray-100 p-4 rounded-lg text-gray-700">
      {{ user.created_at }}
    </div>

  </div>

  <!-- Yükleniyor Durumu -->
  <ng-template #loading>
    <div class="text-center text-gray-500">⏳ Yükleniyor...</div>
  </ng-template>
</div>
