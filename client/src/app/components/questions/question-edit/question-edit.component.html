<div class="max-w-3xl mx-auto p-6 bg-white shadow-md rounded-lg">
  <h2 class="text-2xl font-bold text-gray-800 mb-4">📄 Soru Detayı</h2>

  <div *ngIf="(question$ | async) as question; else loading">
    <!-- Kullanıcı Bilgisi -->
    <div class="flex items-center gap-3 mb-5">
      <div class="w-12 h-12 bg-gray-300 rounded-full flex items-center justify-center text-gray-700 font-semibold">
        {{ question.user.name[0] | uppercase }}
      </div>
      <a [routerLink]="['/dashboard/users/edit',question.user.id]">
        <div class="text-lg font-semibold text-gray-900">
          {{ question.user.name }}
        </div>
      </a>
    </div>

    <!-- Başlık -->
    <div class="mb-4">
      <h3 class="text-xl font-semibold text-gray-800">📝 {{ question.title }}</h3>
    </div>

    <!-- Açıklama -->
    <div class="bg-gray-100 p-4 rounded-lg text-gray-700">
      {{ question.description }}
    </div>

    <!-- Butonlar -->
    <div class="flex justify-between mt-6">
      <button type="button"
              (click)="goBack()"
              class="px-5 py-2 bg-gray-500 text-white rounded-lg hover:bg-gray-600 transition">
        🔙 Geri Dön
      </button>

      <a [routerLink]="['/edit', question.id]"
         class="px-5 py-2 bg-blue-600 text-white rounded-lg shadow-md hover:bg-blue-700 transition">
        ✏️ Düzenle
      </a>
    </div>
  </div>

  <!-- Yükleniyor Durumu -->
  <ng-template #loading>
    <div class="text-center text-gray-500">⏳ Yükleniyor...</div>
  </ng-template>
</div>
