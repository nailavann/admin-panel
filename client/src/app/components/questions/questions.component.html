<div class="max-h-screen flex flex-col">
  <div class="flex-1 overflow-y-auto p-5 space-y-4">
    <a routerLink="add-question"><p class="text-end">Soru Ekle</p></a>
    <div
      class="p-5 bg-white shadow-lg border border-gray-200 rounded-xl flex justify-between items-center gap-6 transition hover:shadow-xl"
      *ngFor="let question of questions">
      <div class="flex items-center gap-3">
        <div class="w-12 h-12 bg-gray-300 rounded-full flex items-center justify-center text-gray-700 font-semibold">
          {{ question.user.name[0] | uppercase }}
        </div>
        <div class="text-gray-900 font-semibold">
          {{ question.user.name | shorten: 8 }}
        </div>
      </div>

      <div class="flex-1 flex flex-col gap-1">
        <span class="text-lg font-semibold text-gray-800">
          {{ question.title | shorten: 100 }}
        </span>
        <span class="text-gray-600 text-sm">
          {{ question.description | shorten: 150 }}
        </span>
      </div>

      <div class="bg-blue-100 p-2 rounded" *ngFor="let category of question.categories">
        {{ category.name }}
      </div>

      <div>
        <a [routerLink]="['edit',question.id]"
           class="px-4 py-2 bg-blue-600 text-white rounded-lg shadow-md hover:bg-blue-700 transition">
          ✏️ Düzenle
        </a>
      </div>
    </div>
  </div>

  <div *ngIf="questions.length === 0" class="flex flex-col items-center justify-center h-64">
    <p class="text-gray-500 text-lg">🚫 Soru bulunamadı.</p>
  </div>

  <div class="p-5 bg-white shadow-md border-t flex justify-center">
    <div class="w-full max-w-lg">
      <mat-paginator
        [length]="length"
        [pageSize]="pageSize"
        [pageIndex]="pageIndex"
        (page)="onPageChange($event)"
        aria-label="Sayfa Seç"
        class="custom-paginator">
      </mat-paginator>
    </div>
  </div>

</div>
